<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banner para TV | Smart Cantina SENAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="missao5/tv.css">
  <script defer src="missao5/tv.js"></script>
</head>
<body>
  <main class="tv-stage" aria-label="Banner da Smart Cantina SENAI">
    <div class="tv-copy">
      <div class="tv-brand">
        <strong>cantina.</strong>
        <img src="missao5/senai.png" alt="SENAI" width="400" height="102">
      </div>
      <div class="tv-slides" id="frases">
        <h1><span>Fila grande</span><span>no intervalo?</span></h1>
        <h1 hidden><span>Conheça a</span><span>Smart Cantina.</span></h1>
        <h1 hidden><span>Veja as opções</span><span>pelo celular.</span></h1>
        <h1 hidden><span>Confira fotos</span><span>e preços.</span></h1>
        <h1 hidden><span>A cantina do futuro</span><span>na palma da sua mão.</span></h1>
      </div>
      <p class="tv-school">Smart Cantina SENAI · Projeto Integrador</p>
    </div>
    <div class="tv-photo" aria-hidden="true"></div>
    <div class="tv-controls">
      <button id="pausar" type="button" aria-pressed="false">Pausar</button>
      <button id="tela-cheia" type="button" hidden>Tela cheia</button>
    </div>
  </main>
</body>
</html>
